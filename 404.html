<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Stranica nije pronađena | Top Montaža</title>
<meta name="theme-color" content="rgb(7, 7, 7)">
<link rel="icon" href="/favicon.png" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:rgb(7, 7, 7);--text:#f4f2ee;--muted:#b3aea6;--accent:#ff6a13;--accent-ink:#111;--display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:var(--bg);color:var(--text);font-family:var(--body);font-size:18px;line-height:1.55}
img{width:min(260px,70vw);height:auto}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1.05;text-transform:uppercase}
p{margin:0;color:var(--muted)}
a.btn{display:inline-block;padding:13px 26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<img src="/logo.png" width="572" height="253" alt="Top Montaža">
<h1>Stranica nije pronađena</h1>
<p>Adresa koju tražite ne postoji ili je premeštena.</p>
<a class="btn" href="/">Nazad na početnu</a>
</body>
</html>
